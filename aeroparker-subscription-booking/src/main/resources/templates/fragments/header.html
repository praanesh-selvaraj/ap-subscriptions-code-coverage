<head th:fragment="header-css (styleSheetUrl, affiliateMetadata, favIconPath)" >
	<title th:utext="${affiliateMetadata.title}"></title>
	
	<meta charset="utf-8" />
	<meta name="robots" content="noindex, nofollow">
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="description" th:content="${T(com.kmp.aeroparker.i18n.htmlutil.HTMLUtil).unescape(affiliateMetadata?.description)}"/>
	<meta name="keywords" th:content="${T(com.kmp.aeroparker.i18n.htmlutil.HTMLUtil).unescape(affiliateMetadata?.keywords)}">
	
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<!-- For Windows 8 -->
	<meta name="msapplication-TileImage" content="../images/icons/win8.png"/>
	
	<!-- For iPad 3 -->
	<link rel="apple-touch-icon-precomposed" sizes="144x144" href="../images/icons/apple-touch-icon-144.png" />
	<!-- For iPhone 4 -->
	<link rel="apple-touch-icon-precomposed" sizes="114x114" href="../images/icons/apple-touch-icon-114.png" />
	<!-- For iPad 1-->
	<link rel="apple-touch-icon-precomposed" sizes="72x72" href="../images/icons/apple-touch-icon-72.png" />
	<!-- For iPhone 3G, iPod Touch and Android -->
	<link rel="apple-touch-icon-precomposed" href="../images/icons/apple-touch-icon-57.png" />
	
	<link th:if="${not #strings.isEmpty(favIconPath)}" th:with="favUrl=${#strings.startsWith(favIconPath, '/favicons') ? favIconPath : '/favicons/' + requestBean.siteId + '/' + favIconPath}" rel="icon" th:href="${requestBean.uploadUrl + favUrl}">
	
	<block th:if="${not #strings.isEmpty(styleSheetUrl)}" th:remove="tag">
		<link th:with="styleSheetUrlReplaced=${#strings.replace(styleSheetUrl, 'core.css', 'core1.css')}" th:href="@{{styleSheetUrlVar}(styleSheetUrlVar=${styleSheetUrlReplaced}, v=${jsCssQueryString})}" rel="stylesheet">
		<link th:with="styleSheetUrlReplaced=${#strings.replace(styleSheetUrl, 'core.css', 'core2.css')}" th:href="@{{styleSheetUrlVar}(styleSheetUrlVar=${styleSheetUrlReplaced}, v=${jsCssQueryString})}" rel="stylesheet">
	</block>
	<block th:unless="${not #strings.isEmpty(styleSheetUrl)}" th:remove="tag">
		<link th:href="@{../skins/css/starter/core1.css(v=${jsCssQueryString})}" rel="stylesheet">
		<link th:href="@{../skins/css/starter/core2.css(v=${jsCssQueryString})}" rel="stylesheet">
	</block>
	<link th:if="${#strings.length(requestBean.subscriptionStyleSheetUrl) > 0}" th:href="@{${requestBean.subscriptionStyleSheetUrl}(v=${jsCssQueryString})}" rel="stylesheet">
	<link th:href="${requestBean.affiliateFontUrl}" rel="stylesheet">	
</head>
