<div th:fragment="StripePayment" th:remove="tag">
	<style>
	.help-block.filled .parsley-required {
		color: rgb(223, 27, 65);
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
			Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
		font-weight: 400;
		font-size: 14.88px;
	}
	
	#cardholderName {
		box-shadow: 0px 0px 0px 0.5px rgba(50, 50, 93, 0.1), 0px 2px 5px 0px rgba(50, 50, 93, 0.1), 0px 1px 1.5px 0px rgba(0, 0, 0, 0.07);
		border-radius: 7px;
		padding: 20px;
		margin-bottom: 10px;
	}
	
	.parsley-errors-list {
		color: rgb(223, 27, 65);
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
			Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
		font-weight: 400;
		font-size: 14.88px;
		list-style-type: none;
		padding-left: 0px;
	}
	</style>

	<div class="form__row" id="payment-method-selector">
		<input type="hidden" name="environment" id="environment" th:value=${environment}>
		<input type="hidden" name="publishableKey" id=publishableKey th:value=${credentials.publishableKey}>
		<input type="hidden" name="clientSecret" id="clientSecret" th:value=${clientSecret}>
		<input type="hidden" name="customerSessionClientSecret" id="customerSessionClientSecret" th:value=${customerSessionClientSecret}>
		<input type="hidden" name="showCountryEnabled" id="showCountryEnabled" th:value=${credentials.showCountryEnabled}>
		<input type="hidden" name="cardholderNameEnabled" id="cardholderNameEnabled" th:value=${credentials.cardholderNameEnabled}>
		<input type="hidden" name="paymentIntentId" id="paymentIntentId" th:value=${paymentIntentId}>
		<input type="hidden" name="isRenewal" id="isRenewal" th:value="${isRenewal != null ? isRenewal : false}">

		<th:block th:if="${credentials.cardholderNameEnabled}">
			<div id="cardholderNameParent">
				<div id="cardholderNameField">
					<label for="cardholder-name" th:text='${languageFieldsList.getTranslation("Cardholder Name")}'>
						<span class="required">*</span>
					</label> 
					<input type="text" id="cardholderName" name="cardholderName"
						class="form-control" data-parsley-required="true"
						th:attr="data-parsley-required-message=${languageFieldsList.getTranslation('Please enter the cardholder''s name.')}"
						data-parsley-trigger="focusout" required>
					<div class="error-message" id="cardholder-name-error"
						style="display: none" th:text="${languageFieldsList.getTranslation('Please enter the cardholder''s name.')}">
					</div>
				</div>
			</div>
		</th:block>
		<input type="checkbox" id="nonCardPayment" name="nonCardPayment" style="display: none;">
		<div th:replace="fragments/payments/stripe-card-form :: stripe-card-form"></div>
		<script th:src="${credentials.stripeJsUrl}"></script>
		<script th:src="@{../js/payments/stripe-payment.js}"></script>
	</div>
</div>
