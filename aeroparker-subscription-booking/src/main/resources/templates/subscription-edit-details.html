<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="fragments/header :: header-css (styleSheetUrl= ${requestBean.affiliatesDisplay?.styleSheetUrl}, affiliateMetadata=${requestBean.affiliatesMetadata}, favIconPath=${requestBean.affiliatesDisplay?.faviconUrl})" >
	<script type="text/javascript" src="/js/jquery-3.7.1.min.js"></script>
	<script type="text/javascript" src="/js/sprinkle.js"></script>
</head>
<body>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<div th:replace="fragments/body-scripts :: body-scripts"></div>
	<div class="wrapper wrapper--multipurchase" th:with="affiliateDisplay= ${requestBean.affiliatesDisplay}, affSubDisplay=${requestBean.affiliateSubscription},
		 affSubDisplayMedia=${requestBean.affiliateSubscriptionMedia}, affSubSettings=${requestBean.affiliateSubscriptionSettings}">
		<div th:replace="fragments/header-main :: header-main" ></div>
		<main class="bg-1" role="main">
			<section class="account__top-bar"></section>
			<section class="account">
			    <div class="container container--thin container--plain">
			        <a th:href="@{view-booking(email=${email}, reference=${session.reference})}" class="btn btn--back">
			            <i class="bi bi-chevron-left"></i>
			            <span th:text="${languageFieldsList.getTranslation('Back to Subscription')}">Back to Subscription</span>
			        </a>
			    </div>
			    <div class="container container--thin">
			    	<form action="edit-details" method="post" class="form no-sidebar" id="AmendForm" novalidate>
                        <div th:replace="~{fragments/edit-details :: edit-details}"></div>
			    	</form>
			    </div>
		    </section>
		</main>
	</div>
	<script th:src="@{../js/vehicle-lookup.js}"></script>
	<script th:inline="javascript">
		$(document).ready(function() {
			var form = $('#AmendForm');
			var parsleyInstance = form.parsley({
				errorClass: 'has-error',
				successClass: 'has-success',
				errorsWrapper: '<ul class="parsley-errors-list"></ul>',
				errorTemplate: '<li></li>',
				classHandler: function(ParsleyField) {
					return ParsleyField.$element.closest('.col-sm-6, .col-sm-12, .col-sm-4');
				}
			});
			
			$('#save-changes-btn').on('click', function(event) {
				event.preventDefault(); 
				
				var parsleyInstance = form.parsley();
			
				parsleyInstance.validate();
			
				var isValid = parsleyInstance.isValid();
			
				if (!isValid) {
					$.each(parsleyInstance.fields, function(idx, field) {
						if (field.validationResult !== true) {
							console.error('Field Error:', {
								fieldName: field.$element.attr('name'),
								errorMessage: field.getErrorsMessages().join(', '),
								currentValue: field.$element.val()
							});
						}
		            });
		        } else {
		            form.submit();
		        }
	    	});
		});
	</script>
	<style>
		/* Styling for disabled input field */
		.input-text--disabled {
		    background-color: #f5f5f5 !important;
		    color: #666 !important;
		    cursor: not-allowed !important;
		    border-color: #ddd !important;
		}
		.input-text--disabled:focus {
		    box-shadow: none !important;
		    border-color: #ddd !important;
		}
		
		/* Styling for parsley errors */
		.parsley-errors-list {
		    margin: 5px 0 0 0;
		    padding: 0;
		    list-style-type: none;
		    color: #d9534f;
		    font-size: 14px;
		    line-height: 1.4;
		    display: block !important;
		    width: 100% !important;
		    clear: both;
		}
		
		.parsley-errors-list li {
		    display: block;
		    margin: 0;
		    padding: 0;
		    width: 100%;
		}
		
		.has-error .input-text,
		.has-error .custom-select {
		    border-color: #d9534f;
		    box-shadow: inset 0 1px 1px rgba(0,0,0,.075), 0 0 6px rgba(217,83,79,.6);
		}
		
		.has-error .custom-select-wrap {
		    border-color: #d9534f;
		}
		
		/* Force errors to appear below inputs */
		.input-text + .parsley-errors-list,
		.custom-select + .parsley-errors-list,
		.custom-select-wrap + .parsley-errors-list {
		    display: block !important;
		    width: 100% !important;
		    clear: both !important;
		    float: none !important;
		}
		
		/* Ensure the column containers don't interfere */
		.col-sm-6, .col-sm-12, .col-sm-4 {
		    position: relative;
		}
	</style>
</body>
</html>
