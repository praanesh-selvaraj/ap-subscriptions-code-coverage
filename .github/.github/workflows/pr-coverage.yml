name: PR Coverage Report

on:
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run tests with coverage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: mvn -B test --settings .github/maven-settings.xml -Dsurefire.excludes="**/*IT.java"

      - name: Post coverage comment
        uses: madrapps/jacoco-report@v1.6
        with:
          paths: >
            ${{ github.workspace }}/aeroparker-subscription-booking/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/aeroparker-subscription-payments/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/aeroparker-subscription-utils/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/aeroparker-subscription-db-config/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage Report
          update-comment: true
          source-paths: >
            aeroparker-subscription-booking/src/main/java,
            aeroparker-subscription-payments/src/main/java,
            aeroparker-subscription-utils/src/main/java,
            aeroparker-subscription-db-config/src/main/java
